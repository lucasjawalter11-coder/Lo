<!doctype html>
<html><head><meta charset="utf-8"><title>Halcyon Clash - pose sheet (dev)</title>
<style>html,body{margin:0;height:100%;background:#20242e;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Dev-only contact sheet: ?chars=kaito,sera&clip=slashH&n=8&cam=34&t0=0&t1=0.5
import * as THREE from './src/three.js';
import { Rig } from './src/character.js';
import { Animator } from './src/anim.js';
import { FIGHTER_BY_ID, FIGHTERS } from './src/fighters.js';
const q = new URLSearchParams(location.search);
const chars = (q.get('chars') || FIGHTERS.map((f) => f.id).join(',')).split(',');
const clip = q.get('clip') || 'idle', n = Number(q.get('n') || 1), cam = q.get('cam') || '34';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.autoClear = false; renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x30283a, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.6); sun.position.set(3, 6, 5); scene.add(sun);
const back = new THREE.DirectionalLight(0x88aaff, 1.2); back.position.set(-4, 3, -5); scene.add(back);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 40), new THREE.MeshStandardMaterial({ color: 0x3a4152, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(6, 12, 0x6677aa, 0x4a5166); grid.position.y = 0.002; scene.add(grid);
const rigs = chars.map((id) => { const r = new Rig(FIGHTER_BY_ID[id]); r.anim = new Animator(r); r.root.visible = false; scene.add(r.root); return r; });
const camera = new THREE.PerspectiveCamera(Number(q.get('fov') || 30), 1, 0.1, 100);
camera.layers.enable(1);
const dist = Number(q.get('dist') || 5.2), cy = Number(q.get('cy') || 0.95);
const angles = { front: 0, '34': 0.65, side: Math.PI / 2, back: Math.PI, '34b': Math.PI - 0.7, left: -Math.PI / 2 };
const cols = Number(q.get('cols') || Math.max(n, chars.length)), rows = Math.ceil(Math.max(1, chars.length * n) / cols);
function draw() {
  renderer.setScissorTest(false); renderer.setClearColor(0x20242e); renderer.clear();
  renderer.setScissorTest(true);
  const W = innerWidth, H = innerHeight, tw = W / cols, th = H / rows;
  let tile = 0;
  const dur = rigs[0].anim.clips[clip].dur || Number(q.get('t1') || 2);
  const t0 = Number(q.get('t0') || 0), t1 = Number(q.get('t1') || dur);
  for (const r of rigs) {
    for (let i = 0; i < n; i++) {
      const t = n > 1 ? t0 + (t1 - t0) * (i / (n - 1)) : t0;
      r.anim.runPhase = t * 9;
      r.anim.pose(clip, t);
      rigs.forEach((o) => { o.root.visible = o === r; });
      const a = angles[cam.split(',')[i % cam.split(',').length]] ?? Number(cam);
      camera.position.set(Math.sin(a) * dist, cy + Number(q.get('ch') || 0.25), Math.cos(a) * dist);
      camera.lookAt(0, cy, 0);
      camera.aspect = tw / th; camera.updateProjectionMatrix();
      const x = (tile % cols) * tw, y = H - (Math.floor(tile / cols) + 1) * th;
      renderer.setViewport(x, y, tw, th); renderer.setScissor(x, y, tw, th);
      renderer.setClearColor(tile % 2 ? 0x242935 : 0x20242e); renderer.clear();
      renderer.render(scene, camera);
      tile++;
    }
  }
}
draw();
window.__game = { ready: true, rigs, draw, THREE, scene, camera };
</script></body></html>
